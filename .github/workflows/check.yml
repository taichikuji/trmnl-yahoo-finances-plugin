name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install preview browser
        run: npx playwright-core install --with-deps chromium
      - name: Verify device and layout previews
        run: npm run preview
        env:
          TRMNL_BROWSER: chromium
