name: Test
on:
  workflow_call:
  push:
    branches: [main]
    # Source and media pushes run this workflow through publish.yml.
    paths:
      - "TRMNL/check.cjs"
      - "TRMNL/fixtures/**"
      - "TRMNL/.trmnlp.yml"
      - "scripts/**"
      - ".github/workflows/test.yml"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Run complete test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install test and preview tools
        run: npm install --no-save --package-lock=false --ignore-scripts liquidjs@10.30.1 playwright-core@1.64.1 yaml@2.9.1
      - name: Test
        run: node --test TRMNL/check.cjs
      - name: Install preview browser
        run: npx playwright-core install --with-deps chromium
      - name: Verify device and layout previews
        run: node scripts/preview.cjs
        env:
          TRMNL_BROWSER: chromium
