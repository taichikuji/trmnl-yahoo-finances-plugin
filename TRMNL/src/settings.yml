---
name: STONKS
description: watch line go up
icon: media/icon.svg
strategy: polling
polling_verb: get
polling_headers: |-
  Accept: application/json
  User-Agent: Mozilla/5.0
polling_url: >-
  https://query1.finance.yahoo.com/v8/finance/chart/
  {%- assign symbols = symbol | default: 'NTNX' | split: ',' -%}
  {%- assign selected = symbols.first | strip | url_decode | upcase -%}
  {%- assign last_symbol = trmnl.state.symbol | default: '' -%}
  {%- assign advance = false -%}
  {%- for value in symbols -%}
    {%- assign candidate = value | strip | url_decode | upcase -%}
    {%- if advance -%}{%- assign selected = candidate -%}{%- break -%}{%- endif -%}
    {%- if candidate == last_symbol -%}{%- assign advance = true -%}{%- endif -%}
  {%- endfor -%}
  {{- selected | url_encode -}}?
  {%- case dateRanges -%}
  {%- when '1d|1' -%}range=1d&interval=1m
  {%- when '1m|30' -%}range=1mo&interval=30m
  {%- when '3m|60' -%}range=3mo&interval=60m
  {%- when '60m|1W' -%}range=5y&interval=1wk
  {%- when 'all|1M' -%}range=max&interval=1mo
  {%- else -%}range=1y&interval=1d
  {%- endcase -%}
  &includePrePost={% if extendedHours == 'show' or extendedHours == 'true' or extendedHours == 'yes' %}true{% else %}false{% endif %}
serverless_language: node
refresh_interval: 15
framework_version: 3.4.3
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: bio
    field_type: author_bio
    name: About STONKS
    category: finance
    github_url: https://github.com/taichikuji/trmnl-yahoo-finances-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-yahoo-finances-plugin/tree/main/TRMNL#setup
    description: Made by Ivan Perez. Yahoo Finance prices and charts for stocks, ETFs, indices, forex and crypto.
  - keyname: symbol
    field_type: string
    name: Symbols
    default: NTNX
    description: One Yahoo Finance symbol, or distinct symbols separated by commas to rotate each successful refresh.
    help_text: 'Examples: NTNX, VWCE.DE, %5ESTOXX50E, BTC-USD, EURUSD=X. Enter NTNX,AAPL,NVDA to rotate. Plain symbols such as ^STOXX50E also work. <a href="https://finance.yahoo.com/" target="_blank">Find a symbol on Yahoo Finance</a>.'
    group: Market
  - keyname: currency
    field_type: string
    name: Currency
    default: USD
    description: Display currency, or NATIVE to use the instrument's currency.
    help_text: 'Examples: USD, EUR, GBP, JPY, BTC, ETH. Conversion requires a Yahoo exchange-rate pair. Historical prices use historical rates; converted OHLC is an estimate. Unsupported pairs show an error.'
    group: Market
  - keyname: dateRanges
    field_type: select
    name: Date range
    default: 12m|1D
    options:
      - '1 day · 1-minute bars': 1d|1
      - '1 month · 30-minute bars': 1m|30
      - '3 months · hourly bars': 3m|60
      - '1 year · daily bars': 12m|1D
      - '5 years · weekly bars': 60m|1W
      - 'All time · monthly bars': all|1M
    help_text: Ranges vary by symbol. Long histories are grouped to fit saved state; ×N shows how many bars were combined.
    group: Market
  - keyname: extendedHours
    field_type: select
    name: Extended hours
    default: hide
    options:
      - Regular session: hide
      - Include pre/post market: show
    description: Pre-market and after-hours prices, where available. Intraday ranges only.
    group: Market
  - keyname: chartType
    field_type: select
    name: Chart type
    default: line
    options:
      - Line: line
      - Bars: bars
      - Candles: candles
    group: Chart
  - keyname: lineWidth
    field_type: number
    name: Line width
    default: 2
    description: 'Stroke width for lines, bars and candle outlines: 1–5 px.'
    group: Chart
  - keyname: lineType
    field_type: select
    name: Line style
    default: '2'
    options:
      - Straight: '0'
      - Stepped: '1'
      - Smooth: '2'
    description: Applies to line charts.
    group: Chart
  - keyname: showGridlines
    field_type: select
    name: Grid lines
    default: hide
    options:
      - Show: show
      - Hide: hide
    group: Chart
  - keyname: showVolume
    field_type: select
    name: Volume
    default: hide
    options:
      - Show: show
      - Hide: hide
    description: Trading volume below the chart, when available.
    group: Chart
  - keyname: showReference
    field_type: select
    name: Return baseline
    default: hide
    options:
      - Show: show
      - Hide: hide
    description: Dashed line used to measure the return. Color screens highlight the line chart above and below it.
    help_text: Native-currency 1D uses the previous close when available. Converted 1D uses the first aligned bar; other ranges use the first close.
    group: Chart
  - keyname: locale
    field_type: select
    name: Language
    default: en
    options:
      - English: en
      - German: de_DE
      - French: fr
      - Spanish: es
      - Italian: it
      - Polish: pl
    group: Text
  - keyname: headerFontSize
    field_type: select
    name: Heading size
    default: medium
    options:
      - Small: small
      - Normal: medium
      - Large: large
    description: Company name and price.
    group: Text
  - keyname: fontSize
    field_type: number
    name: Label size
    default: 12
    description: Chart labels and supporting text, from 8 to 16 px. Default 12 px; scales with device density.
    group: Text
  - keyname: precision
    field_type: select
    name: Decimal places
    default: auto
    options:
      - Automatic: auto
      - '0 decimals': '0'
      - '2 decimals': '2'
      - '4 decimals': '4'
      - '6 decimals': '6'
    group: Text
